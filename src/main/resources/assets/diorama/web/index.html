<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama</title>
<link rel="stylesheet" href="/web/leaflet/leaflet.css">
<link rel="stylesheet" href="/web/diorama.css">
</head>
<body>
<div id="map"></div>
<div id="bar">
  <strong>Diorama</strong>
  <select id="world" aria-label="World"></select>
  <button id="turn-left" type="button" title="Turn the view (Q)" aria-label="Turn the view left">⟲</button>
  <span id="facing"></span>
  <button id="turn-right" type="button" title="Turn the view (E)" aria-label="Turn the view right">⟳</button>
  <button id="night" type="button" aria-label="Day or night" hidden>☀</button>
  <span id="coords"></span>
</div>
<div id="notice" hidden></div>
<script src="/web/leaflet/leaflet.js"></script>
<script src="/web/diorama.js"></script>
</body>
</html>

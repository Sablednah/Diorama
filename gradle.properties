# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# The 26.3 line (branch mc26.3). 26.2 was the first line Diorama targeted, on main.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.58-beta
# The NeoForge floor the published jar declares, kept separate from the build so that building
# against a newer NeoForge never quietly locks out installs that would run fine. See Standards'
# gradle.properties for the full argument.
#
# ⚠ EXCEPT on 26.3, which pins a build deliberately: FML 12.0.8 (NeoForge 26.3.0.37-beta) renamed
# ModConfig.Type COMMON -> LOCAL and SERVER -> SYNCED, and this line registers LOCAL, which does not
# exist below it - an older NeoForge would die with NoSuchFieldError rather than refuse to load.
# .58 is what was built and tested against, matching Standards' mc26.3. "-beta" matters: Maven
# orders 26.3.0.58-beta before 26.3.0.58, so a floor without it would refuse the very build tested.
neo_version_min=26.3.0.58-beta
loader_version_range=[1,)

## Mod Properties
mod_id=diorama
mod_name=SableCraft Diorama
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.sablednah.diorama
mod_authors=Sablednah
mod_description=An isometric web map of your world, rendered on the server from the real block models. Open it in a browser - on a dedicated server, or on a local port from single player.

## Dev server
# Free in the series port table (Standards 25569-25576, Chronicler 25573/25583, LegendQuest 25590s).
# The 26.3 line takes 25603 (web 8126 in its run dir's config), so it can run beside main's 26.2
# dev server on 25600 (web 8124). This is passed to runServer as --port, overriding server.properties.
dev_server_port=25603

# /mnt/d (drvfs) sends no inotify events, so Gradle's file-system watching misses new files:
# a freshly added class compiled as "cannot find symbol" until --rerun. Re-scan every build.
org.gradle.vfs.watch=false
